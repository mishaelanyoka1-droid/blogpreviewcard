<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <title>Frontend Mentor | Blog preview card</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.google.com/specimen/Figtree" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Figtree', variable, italic, sans-serif;
      font-size: 16px;
      background-color: hsl(47, 88%, 63%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .card {
      background-color: hsl(0, 0%, 100%);
      border: 1px solid hsl(0, 0%, 7%);
      border-radius: 20px;
      box-shadow: 8px 8px 0 hsl(0, 0%, 7%);
      padding: 24px;
      width: 100%;
      max-width: 327px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .card img.illustration {
      display: block;
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 10px;
    }

    .content {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .tag {
      background-color: hsl(47, 88%, 63%);
      color: hsl(0, 0%, 7%);
      font-size: 12px;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 4px;
      margin-bottom: 16px;
    }

    .date {
      font-size: 12px;
      font-weight: 500;
      color: hsl(0, 0%, 7%);
      margin-bottom: 12px;
    }

    .title {
      font-size: 24px;
      font-weight: 800;
      line-height: 1.2;
      color: hsl(0, 0%, 7%);
      margin-bottom: 12px;
    }

    .description {
      font-size: 16px;
      font-weight: 500;
      line-height: 1.5;
      color: hsl(0, 0%, 42%);
    }

    .author {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      font-weight: 800;
      color: hsl(0, 0%, 7%);
    }

    .author img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
    }

    .attribution {
      margin-top: 2rem;
      font-size: 11px;
      text-align: center;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }

    @media (min-width: 1440px) {
      .card {
        max-width: 384px;
        padding: 32px;
      }
    }
  </style>
</head>

<body>
  <article class="card">
    <img class="illustration" src="./assets/images/illustration-article.svg" alt="">

    <div class="content">
      <span class="tag">Learning</span>
      <p class="date">Published 21 Dec 2023</p>
      <h1 class="title">HTML & CSS foundations</h1>
      <p class="description">
        These languages are the backbone of every website, defining structure, content, and presentation.
      </p>
    </div>

    <div class="author">
      <img src="./assets/images/image-avatar.webp" alt="">
      <span>Greg Hooper</span>
    </div>
  </article>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="https://github.com/mishaelanyoka1-droid">Mishael Anyoka</a>.
  </footer>
</body>

</html>
